<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Success - HelloIdly</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="mobile-wrapper">
        <main class="success-container">
            <div class="success-icon">✅</div>
            <h1>Order Successful</h1>

            <div class="token-card">
                <p class="label">Order No</p>
                <h2 id="order-no">...</h2>

                <div class="divider"></div>

                <p class="label">Pass Code</p>
                <h2 id="pass-code" class="passcode">...</h2>
            </div>

            <p class="instruction">Show this at counter to collect token</p>

            <div class="order-status-box">
                <p>Status: <span id="order-status">PAID</span></p>
            </div>

            <a href="menu.html" class="home-btn">Order More</a>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
